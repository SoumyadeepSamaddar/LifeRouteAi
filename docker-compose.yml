version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: liferoute_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Kolkatann@2025
      MYSQL_DATABASE: liferoute_ai_db
      MYSQL_USER: root
      MYSQL_PASSWORD: Kolkatann@2025
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: liferoute_backend
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/liferoute_ai_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Kolkatann@2025
      ML_SERVICE_URL: http://ml-service:5000
    depends_on:
      - db

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: liferoute_ml
    restart: on-failure
    ports:
      - "5000:5000"
    volumes:
      - ./ml-service:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: liferoute_frontend
    restart: on-failure
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mysql_data: