server:
  port: ${SERVER_PORT:8081}
  servlet:
    session:
      timeout: 30m
      cookie:
        name: JSESSIONID
        http-only: true
        secure: false # Set to true in production HTTPS
        same-site: lax

spring:
  application:
    name: life-root-ai
  datasource:
    url: ${DB_URL:jdbc:h2:mem:liferoot;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER_CLASS_NAME:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
        jdbc:
          time_zone: Asia/Kolkata
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    baseline-on-migrate: true
    locations: classpath:db/migration
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: always
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SMTP_USER:noreply@liferoot.ai}
    password: ${SMTP_PASS:changeme}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

app:
  cors:
    allowed-origin: http://localhost:5173
  maps:
    api-key: ${GOOGLE_MAPS_API_KEY:YOUR_SERVER_SIDE_GOOGLE_MAPS_KEY}
    provider: ${APP_MAPS_PROVIDER:mock}
  notifications:
    provider: ${APP_NOTIFICATIONS_PROVIDER:log}